set -g escape-time 0
set -g default-terminal "tmux-256color"  # Mac and Ubuntu
set -sa terminal-overrides ",xterm-256color:Tc"
# Ghostty: truecolor + undercurl (pattern-gated — only applies to clients
# attaching with TERM=xterm-ghostty, so it's inert on Linux consoles etc.)
set -sa terminal-overrides ',xterm-ghostty:RGB'
set -as terminal-overrides ',xterm-ghostty:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',xterm-ghostty:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g default-shell $SHELL

# Let nvim see focus changes (autoread, gitsigns refresh on pane switch)
set -g focus-events on

# Close a window and the rest renumber to fill the gap
set -g renumber-windows on

#-------------------------------------------------------#
# Colour palette
# Slots 0-15 (and names like "black") resolve through the terminal
# theme (Seoulbones Dark in Ghostty); 16-255 are a fixed cube.
# https://upload.wikimedia.org/wikipedia/commons/1/15/Xterm_256color_chart.svg
# NOTE: tmux only expands $variables inside double quotes.
#-------------------------------------------------------#
c_bg='colour232'          # pane background
c_fg='colour250'          # active pane text
c_fg_dim='colour247'      # inactive pane text
c_status_bg='colour235'   # status bar background
c_segment='colour238'     # status segment / border / message background
c_text_dim='colour242'    # music track
c_green='colour121'       # secondary status text (datetime, window names)
c_yellow='colour222'      # emphasized status text (current window, messages)
c_accent='colour154'      # chartreuse: session name, active border, activity

#-------------------------------------------------------#
# Pane colours
# https://upload.wikimedia.org/wikipedia/commons/1/15/Xterm_256color_chart.svg
#-------------------------------------------------------#
# set inactive/active window styles
set -g window-style "fg=$c_fg_dim,bg=$c_bg"
set -g window-active-style "fg=$c_fg,bg=$c_bg"

# pane border
set -g pane-active-border-style "fg=$c_accent"
set -g pane-border-style "fg=$c_segment"
#-------------------------------------------------------#

# Enable mouse mode (select/resize panes)
set -g mouse on

# Use vim keybindings in copy mode
set -g mode-keys vi
set -g status-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || true"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || true"

# set scrollback history to 50000 (50k)
set -g history-limit 50000

# split panes using | and -
bind-key | split-window -h
bind-key - split-window -v

# pane movement similar to vim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resize panes
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# monitor activities in other windows
set -g monitor-activity on
set -g visual-activity on

# reload ~/.tmux.conf using PREFIX r
bind-key r source-file ~/.tmux.conf \; display "Reloaded!"

# List of plugins
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'tmux-plugins/tmux-battery'   # display battery status in tmux status-right
set -g @plugin 'tmux-plugins/tmux-continuum' # save tmux environment
set -g @plugin 'tmux-plugins/tmux-resurrect' # restore saved tmux environment
set -g @plugin 'tmux-plugins/tmux-yank'      # copy to the system clipboard in tmux
set -g @plugin 'tmux-plugins/tpm'            # tmux plugin manager
# set -g @plugin 'Brutuski/tmux-ticker'        # stock ticker

# prefix + Ctrl-s to save session
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'fullscreen'
set -g @shell_mode 'vi'
set -g @continuum-save-interval '60'
set -g @resurrect-save 'S'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'  # inert on hosts with no nvim panes
set -g @resurrect-capture-pane-contents 'on'

# Configure colors for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_cpu_color_low "$color_level_ok"
set -g @sysstat_cpu_color_medium "$color_level_warn"
set -g @sysstat_cpu_color_stress "$color_level_stress"

set -g @sysstat_mem_color_low "$color_level_ok"
set -g @sysstat_mem_color_medium "$color_level_warn"
set -g @sysstat_mem_color_stress "$color_level_stress"

set -g @sysstat_swap_color_low "$color_level_ok"
set -g @sysstat_swap_color_medium "$color_level_warn"
set -g @sysstat_swap_color_stress "$color_level_stress"

#-------------------------------------------------------#
# status bar theme
# based on https://gist.github.com/rajanand02/9407361
#-------------------------------------------------------#

# tmux status message
set -g message-style "bg=$c_segment,fg=$c_yellow"

# powerline status layout
set -g status 'on'
set -g status-interval 60
set -g status-justify 'centre'
set -g status-left-length '100'
set -g status-right-length '100'
set -g status-right-style 'none'
set -g status-style 'none'
set -g status-style "bg=$c_status_bg,none"

# status left
grey_left_triangle="#[fg=$c_segment,bg=$c_status_bg,nobold,nounderscore,noitalics]"
dark_grey_left_triangle="#[fg=$c_status_bg,bg=$c_status_bg,nobold,nounderscore,noitalics]"
status_session_name="#[fg=$c_bg,bg=$c_accent] #S #[fg=$c_accent,bg=$c_segment,nobold,nounderscore,noitalics]"
status_process="#[fg=$c_yellow,bg=$c_segment] #W #[fg=$c_segment,bg=$c_status_bg,nobold,nounderscore,noitalics]"
status_whoami="#[fg=$c_green,bg=$c_status_bg] #(whoami) "
status_uptime="#[fg=$c_green,bg=$c_status_bg] #(uptime  | cut -d \" \" -f 1,2,3) $dark_grey_left_triangle"
status_music="#[fg=$c_text_dim] #(/usr/local/dotfiles/bin/tmux-current-track.sh)"
set -g status-left "$status_session_name $status_process $status_music"

# window status (middle)
set -g window-status-activity-style "bg=$c_status_bg,fg=$c_accent,none"
set -g window-status-separator ''
set -g window-status-style "bg=$c_status_bg,fg=$c_green,none"
set -g window-status-format "$dark_grey_left_triangle#[default] #I  #W $dark_grey_left_triangle"
set -g window-status-current-format "#[fg=$c_status_bg,bg=$c_segment,nobold,nounderscore,noitalics]#[fg=$c_yellow,bg=$c_segment] #I  #W  #F #[fg=$c_segment,bg=$c_status_bg,nobold,nounderscore,noitalics]"

# status right
segment_left_triangle="#[fg=$c_segment,bg=$c_status_bg,nobold,nounderscore,noitalics]"
grey_left_triangle="#[fg=$c_status_bg,bg=$c_segment,nobold,nounderscore,noitalics]"
# Cached version (refreshes every 15min):
wttr='#(/usr/local/dotfiles/bin/tmux-weather-cached.sh)'
status_weather="$segment_left_triangle#[fg=$c_yellow,bg=$c_segment] $wttr"
status_datetime="$grey_left_triangle#[fg=$c_green,bg=$c_status_bg] %Y-%m-%d  %a  %I:%M %p"
# set -g @ticker_stock "HCP"
# set -g @ticker_positive_style  "#[fg=#A7C080]"
# set -g @ticker_negative_style  "#[fg=#FF4858]"
status_sysstat=" #{sysstat_mem}"
status_battery="#{battery_color_charge_fg}#[bg=$c_status_bg]#{battery_color_charge_bg} Batt: #{battery_percentage} "
set -g status-right "$status_weather $status_datetime $status_sysstat $status_battery"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
setenv -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'
